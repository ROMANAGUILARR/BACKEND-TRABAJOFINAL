name: CI/CD - Pruebas y Deploy a Render

# Se ejecuta con cada cambio en la rama main (y se puede lanzar a mano desde la pestaña Actions).
# En un pull request hacia main solo corre las pruebas, sin desplegar.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. Instala Java 21, la versión del proyecto, y guarda en caché las dependencias de Maven
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Ejecuta las pruebas automatizadas; si alguna falla, el flujo se detiene y no se despliega
      - name: Ejecutar pruebas
        run: mvn -B test

  deploy:
    runs-on: ubuntu-latest
    needs: test # Solo corre si las pruebas pasan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      # 4a. Avisa el inicio del despliegue
      - name: Preparar despliegue
        run: echo "Pruebas aprobadas. Iniciando despliegue hacia Render..."

      # 4b. Llama al Deploy Hook de Render, guardado como secreto en GitHub (nunca en el código)
      - name: Desplegar en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK en Settings > Secrets and variables > Actions"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Despliegue solicitado a Render."
