#application.properties
spring.application.name=EcoSolido
server.port=${PORT:8080}
huggingface.api.url=https://router.huggingface.co/v1/chat/completions
huggingface.api.key=${HF_TOKEN:}
gemini.api.key=${GEMINI_API_KEY:}
token.secret.value=${TOKEN_SECRET_VALUE}
reniec.api.url=${RENIEC_API_URL:}
reniec.api.token=${RENIEC_API_TOKEN:}
cloudinary.url=${CLOUDINARY_URL:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Database
# Supabase (PostgreSQL). Usar la URL del "Session pooler" de Supabase, p. ej.:
# jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# JPA — el esquema lo gestiona Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Flyway — migraciones versionadas
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Si la BD ya tiene tablas (desarrollo existente), marca baseline sin re-ejecutar V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Repara checksums si se corrige una migración ya aplicada (dev)
spring.flyway.repair-on-migrate=true
# Logging
logging.level.org.springframework.web=INFO
logging.level.com.DisenoProductos=INFO
# Backup diario con pg_dump (desactivado por defecto; Supabase ya respalda la BD)
backup.enabled=${BACKUP_ENABLED:false}
pgdump.path=${PGDUMP_PATH:pg_dump}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
# Arranque mas rapido en Render
spring.jpa.open-in-view=false
# Carga por lotes de relaciones LAZY (cuadrilla, evidencias): evita una consulta por incidencia
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Máximo de incidencias en curso (pendientes o en proceso) por cuadrilla
cuadrilla.max-incidencias-en-curso=${CUADRILLA_MAX_EN_CURSO:3}
# Frontends extra permitidos por CORS, separados por comas (p. ej. la URL de Vercel)
cors.origenes-extra=${CORS_ORIGENES_EXTRA:}
spring.jmx.enabled=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Modelos de Gemini para describir fotos (se pueden cambiar sin tocar codigo)
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.fallback.model=${GEMINI_FALLBACK_MODEL:gemini-3.1-flash-lite}
gemini.fallback2.model=${GEMINI_FALLBACK2_MODEL:gemini-3.5-flash}
# Swagger UI (documentación de la API)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
