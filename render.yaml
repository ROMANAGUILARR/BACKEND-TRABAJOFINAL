# EcoSolido Backend — Render Blueprint
services:
  - type: web
    name: ecosolido-backend
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: ./

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: TOKEN_SECRET_VALUE
        generateValue: true

      # Completar en Render Dashboard con tus tokens reales
      - key: HF_TOKEN
        sync: false
      - key: RENIEC_API_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false

      # MySQL externo (Render no incluye MySQL)
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: MYSQLDUMP_PATH
        value: /usr/bin/mysqldump
