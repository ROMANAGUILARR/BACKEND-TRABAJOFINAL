# EcoSolido Backend — Render
services:
  - type: web
    name: ecosolido-backend
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: ./

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: TOKEN_SECRET_VALUE
        generateValue: true

      # REQUERIDAS — completar en Render Dashboard
      - key: HF_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RENIEC_API_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false

      # PostgreSQL en Supabase (usar la cadena del "Session pooler")
      # DB_URL = jdbc:postgresql://<host-pooler>:5432/postgres?sslmode=require
      # DB_USER = postgres.<id-del-proyecto>
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
